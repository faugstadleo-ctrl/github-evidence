<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask for access — Flaike</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/">Flaike</a>
      <div class="links">
        <a href="/">Product</a>
        <a href="/inquire">Ask for access</a>
        <a class="btn" href="/login">Log in</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="wrap narrow">
      <h1>Ask for access</h1>
      <p class="muted">Tell us what you need. We look at it and get back to you. You do not pay on this page.</p>
      <div class="card">
        <label>Name</label>
        <input id="name" placeholder="Your name">
        <label>Company</label>
        <input id="company" placeholder="Company name">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@company.com">
        <label>What do you need?</label>
        <textarea id="note" placeholder="For example: we need proof that pull requests were reviewed for an upcoming audit."></textarea>
        <button onclick="sendInquiry()">Send request</button>
        <p id="status"></p>
      </div>
    </div>
  </main>
  <footer>
    <div class="foot">
      <span>Flaike · 2026</span>
      <span>
        <a href="/terms">Terms of use</a>
        <a href="/">Product</a>
        <a href="/login">Log in</a>
      </span>
    </div>
  </footer>
  <script>
    async function sendInquiry() {
      const status = document.getElementById('status');
      const body = {
        name: document.getElementById('name').value.trim(),
        company: document.getElementById('company').value.trim(),
        email: document.getElementById('email').value.trim(),
        note: document.getElementById('note').value.trim()
      };
      if (!body.name || !body.email) {
        status.innerHTML = '<span class="error">Name and email are required.</span>';
        return;
      }
      status.textContent = 'Sending...';
      try {
        const res = await fetch('/api/inquire', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not send');
        status.innerHTML = '<span class="ok">Request sent. We will get back to you.</span>';
        document.getElementById('name').value = '';
        document.getElementById('company').value = '';
        document.getElementById('email').value = '';
        document.getElementById('note').value = '';
      } catch (err) {
        status.innerHTML = '<span class="error">' + err.message + '</span>';
      }
    }
  </script>
</body>
</html>
