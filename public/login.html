<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Flaike</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/">Flaike</a>
      <div class="links">
        <a href="/">Product</a>
        <a href="/inquire">Inquire</a>
        <a class="btn" href="/login">Log in</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="wrap narrow" style="max-width:480px;">
      <h1>Log in</h1>
      <p class="muted">Use the username and password you were given.</p>
      <div class="card">
        <label>Username</label>
        <input id="username" autocomplete="username">
        <label>Password</label>
        <div class="row">
          <input id="password" type="password" autocomplete="current-password" style="flex:1;">
          <button type="button" class="secondary" id="show-password" onclick="togglePassword()" style="margin-top:0;">Show</button>
        </div>
        <button onclick="login()">Log in</button>
        <p id="status" class="error"></p>
      </div>
    </div>
  </main>
  <footer>
    <div class="foot">
      <span>Flaike · 2026</span>
      <span>
        <a href="/terms">Terms of use</a>
        <a href="/">Product</a>
        <a href="/inquire">Inquire</a>
      </span>
    </div>
  </footer>
  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const button = document.getElementById('show-password');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.textContent = showing ? 'Show' : 'Hide';
    }
    document.getElementById('password').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') login();
    });
    async function login() {
      const status = document.getElementById('status');
      status.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) {
        status.textContent = data.error || 'Login failed';
        return;
      }
      window.location.href = '/app';
    }
  </script>
</body>
</html>
