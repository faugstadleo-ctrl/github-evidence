<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logs — Flaike</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
<header>
  <nav>
    <a class="brand" href="/app">Flaike</a>
    <div class="links">
      <a href="/app">Tool</a>
      <a href="/admin">Admin</a>
      <a href="/logs">Logs</a>
      <button class="nav" onclick="logout()">Log out</button>
    </div>
  </nav>
</header>
<main>
  <div class="wrap">
  <h1>Logs</h1>
  <p class="muted">Requests you have already decided on. The note is only for you.</p>
  <div id="piles">Loading...</div>
  <script>
    const PILES = [
      { key: 'approved', title: 'Approved' },
      { key: 'disapproved', title: 'Not approved' },
      { key: 'ignored', title: 'Ignored' }
    ];
    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&' + 'amp;').replace(/</g, '&' + 'lt;').replace(/>/g, '&' + 'gt;').replace(/"/g, '&' + 'quot;');
    }
    function renderPile(pile, items) {
      const body = items.length
        ? items.map(item =>
            '<div class="pr"><strong>' + escapeHtml(item.name) + '</strong> · ' + escapeHtml(item.email)
            + '<br><span class="meta">' + escapeHtml(item.company || 'No company') + ' · ' + escapeHtml(new Date(item.at).toLocaleString()) + '</span>'
            + '<br>' + escapeHtml(item.note || '')
            + '<label>Why</label><textarea id="reason-' + escapeHtml(item.at) + '">' + escapeHtml(item.reason || '') + '</textarea>'
            + '<button type="button" onclick="saveReason(\'' + escapeHtml(item.at) + '\', \'' + pile.key + '\')">Save note</button>'
            + '<span id="saved-' + escapeHtml(item.at) + '" class="ok"></span></div>'
          ).join('')
        : '<p class="meta">None yet.</p>';
      return '<details><summary>' + pile.title + ' (' + items.length + ')</summary>' + body + '</details>';
    }
    async function load() {
      const res = await fetch('/api/inquiries');
      if (!res.ok) { window.location.href = '/login'; return; }
      const list = await res.json();
      document.getElementById('piles').innerHTML = PILES.map(pile =>
        renderPile(pile, list.filter(item => item.status === pile.key).slice().reverse())
      ).join('');
    }
    async function saveReason(at, status) {
      const box = document.getElementById('reason-' + at);
      const saved = document.getElementById('saved-' + at);
      const res = await fetch('/api/inquiries/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ at, status, reason: box ? box.value : '' })
      });
      if (saved) saved.textContent = res.ok ? ' Saved.' : ' Could not save.';
    }
    load();
  </script>


  </div>
</main>
<footer>
  <div class="foot">
    <span>Flaike · 2026</span>
    <span>
      <a href="/terms">Terms of use</a>
      <a href="/">Product</a>
      <a href="/inquire">Inquire</a>
    </span>
  </div>
</footer>
</body>
</html>
